name: Update Tomcat Blob

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

env:
  TOMCAT_BASE_URL: "https://dlcdn.apache.org/tomcat"
  TOMCAT_CHECKSUM_BASE_URL: "https://downloads.apache.org/tomcat"

jobs:
  upgrade-tomcat:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        tomcat: [ '11' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup BOSH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/bosh
          gh release download --repo cloudfoundry/bosh-cli --pattern "*-linux-amd64" --output /tmp/bosh/bosh
          chmod +x /tmp/bosh/bosh
          PATH=$PATH:/tmp/bosh
          echo "/tmp/bosh" >> $GITHUB_PATH
          bosh --version

      - name: Setup Git
        run: |
          git config --global user.email "identity-uaa+ci@pivotal.io"
          git config --global user.name "UAA Identity Bot"

      - name: BOSH Setup
        env:
          PRIVATE_YML: ${{ secrets.PRIVATE_YML }}
        run: |
          echo "${PRIVATE_YML}" > config/private.yml
          echo "key_id: $(sed -nE 's/.*access_key_id:.(.{2}).*(.{4})$/\1...\2/p' config/private.yml)"

      - name: Check Tomcat Version
        env:
          TOMCAT_VERSION: ${{ matrix.tomcat }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOMCAT_INDEX_URL=${TOMCAT_BASE_URL}/tomcat-${TOMCAT_VERSION}
          tomcat_versions="$(curl -sSfL "${TOMCAT_INDEX_URL}" \
            | sed -nr 's/^.*<a href="v([0-9\.]+)\/">.*$/\1/p' \
            | sort --version-sort )"
          echo "${tomcat_versions}" 
          LATEST_TOMCAT_VERSION=$( echo "${tomcat_versions}" | tail -n 1 )
          
          echo "# Apache Tomcat v${LATEST_TOMCAT_VERSION}" >> $GITHUB_STEP_SUMMARY
          if [[ -z "${LATEST_TOMCAT_VERSION}" ]]; then
            echo "## ERROR: Did not find any versions of tomcat at $TOMCAT_INDEX_URL" >> $GITHUB_STEP_SUMMARY 
            exit 1
          fi
          
          TOMCAT_URL="${TOMCAT_INDEX_URL}/v${LATEST_TOMCAT_VERSION}/bin/apache-tomcat-${LATEST_TOMCAT_VERSION}.tar.gz"
          OLD_TOMCAT_NAME=$(bosh blobs | grep "tomcat-${TOMCAT_VERSION}" | cut -f1 | tr -d ' ')        
          NEW_TOMCAT_NAME="apache-tomcat-${LATEST_TOMCAT_VERSION}.tar.gz"
          if [[ "${OLD_TOMCAT_NAME}" == "${NEW_TOMCAT_NAME}" ]]; then
            echo "## ☑️ No new version of tomcat-${TOMCAT_VERSION} found." >> $GITHUB_STEP_SUMMARY 
            exit 0
          fi
          
          echo "## ✅ Found new version ${LATEST_TOMCAT_VERSION} of tomcat" >> $GITHUB_STEP_SUMMARY
          echo "Previous Version: ${OLD_TOMCAT_NAME}" >> $GITHUB_STEP_SUMMARY

          TOMCAT_FILENAME=$(basename "${NEW_TOMCAT_NAME}")
          curl -fL -o "${TOMCAT_FILENAME}" "${TOMCAT_URL}"
          TOMCAT_RELEASE_URL="${TOMCAT_CHECKSUM_BASE_URL}/tomcat-${TOMCAT_VERSION}/v${LATEST_TOMCAT_VERSION}/bin/${TOMCAT_FILENAME}"
          curl -fL -o tomcat_sha "${TOMCAT_RELEASE_URL}.sha512"
          curl -fL -o tomcat.asc "${TOMCAT_RELEASE_URL}.asc"
          curl -fL -o tomcat_keys "${TOMCAT_CHECKSUM_BASE_URL}/tomcat-${TOMCAT_VERSION}/KEYS"

          fail() {
            echo "## ERROR: $1" >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          # 1. Checksum from downloads.apache.org
          DOWNLOADED_FILE_SUM=$(sha512sum "${TOMCAT_FILENAME}" | cut -f1 -d ' ')
          EXPECTED_SUM=$(cut -f1 -d ' ' tomcat_sha)
          [[ "${DOWNLOADED_FILE_SUM}" == "${EXPECTED_SUM}" ]] \
            || fail "Downloaded file did not match checksum from downloads.apache.org"

          # 2. PGP signature, signed by a key whose fingerprint is pinned in this repo
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import tomcat_keys
          gpg_rc=0
          gpg_status="$(gpg --batch --status-fd 1 --verify tomcat.asc "${TOMCAT_FILENAME}" 2>/dev/null)" || gpg_rc=$?
          [[ "${gpg_rc}" -eq 0 ]] || fail "gpg could not verify the PGP signature on ${TOMCAT_FILENAME} (exit ${gpg_rc})"
          # gpg prints VALIDSIG even when the signing key is expired or revoked, so reject those explicitly
          if echo "${gpg_status}" | awk '$2 ~ /^(EXPKEYSIG|REVKEYSIG|EXPSIG|BADSIG|ERRSIG)$/ { found = 1 } END { exit !found }'; then
            fail "PGP signature on ${TOMCAT_FILENAME} was made with an expired or revoked key, or is invalid"
          fi
          echo "${gpg_status}" | awk '$2 == "GOODSIG" { found = 1 } END { exit !found }' \
            || fail "No good PGP signature on ${TOMCAT_FILENAME}"
          SIGNER=$(echo "${gpg_status}" | awk '$2 == "VALIDSIG" { print $NF }')
          [[ -n "${SIGNER}" && "${SIGNER}" != *$'\n'* ]] || fail "Expected exactly one valid PGP signature on ${TOMCAT_FILENAME}"
          grep -qi "^${SIGNER}\b" .github/tomcat-signing-fingerprints.txt \
            || fail "Signed by ${SIGNER}, which is not in .github/tomcat-signing-fingerprints.txt"
          echo "Verified sha512 and PGP signature (${SIGNER})" >> $GITHUB_STEP_SUMMARY

          bosh add-blob "${TOMCAT_FILENAME}" "${NEW_TOMCAT_NAME}"
          bosh upload-blobs
          bosh remove-blob "${OLD_TOMCAT_NAME}"

          git status
          git add config/blobs.yml
          git status

          BRANCH_NAME="Tomcat-${LATEST_TOMCAT_VERSION}"

          if [[ -n "$(gh pr list --head "${BRANCH_NAME}" --state open --json number --jq '.[0].number')" ]]; then
            echo "## ☑️ PR already open for ${BRANCH_NAME}" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          git checkout -b "${BRANCH_NAME}"
          git commit -m "Upgrade Tomcat to version ${LATEST_TOMCAT_VERSION}"
          git push -u origin "${BRANCH_NAME}"

          commit_id=$(git log -n 1 --graph --pretty='%Cred%h%Creset - %s%Creset' | sed 's/^.//')
          echo "✅ Committed ${commit_id}" >> $GITHUB_STEP_SUMMARY

          gh pr create --title "Upgrade Tomcat to version ${LATEST_TOMCAT_VERSION}" --body "Automated upgrade of Tomcat to version ${LATEST_TOMCAT_VERSION}."
