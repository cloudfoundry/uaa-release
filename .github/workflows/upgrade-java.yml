name: Update Java Blob

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  upgrade-java:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        java: [ '25' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup BOSH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/bosh
          gh release download --repo cloudfoundry/bosh-cli --pattern "*-linux-amd64" --output /tmp/bosh/bosh
          chmod +x /tmp/bosh/bosh
          PATH=$PATH:/tmp/bosh
          echo "/tmp/bosh" >> $GITHUB_PATH
          bosh --version

      - name: Setup Git
        run: |
          git config --global user.email "identity-uaa+ci@pivotal.io"
          git config --global user.name "UAA Identity Bot"

      - name: Setup BOSH
        env:
          PRIVATE_YML: ${{ secrets.PRIVATE_YML }}
        run: |
          echo "${PRIVATE_YML}" > config/private.yml
          echo "key_id: $(sed -nE 's/.*access_key_id:.(.{2}).*(.{4})$/\1...\2/p' config/private.yml)"

      - name: Check Java Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          java_major_version=${{ matrix.java }}
          binary_metadata_url="https://api.bell-sw.com/v1/liberica/releases?version-modifier=latest"
          binary_metadata_url+="&version-feature=${java_major_version}"
          binary_metadata_url+="&os=linux"
          binary_metadata_url+="&arch=x86"
          binary_metadata_url+="&bitness=64"
          binary_metadata_url+="&bundle-type=jdk"
          binary_metadata_url+="&installation-type=archive"

          # Newest first; don't rely on the API's ordering. patchVersion must outrank buildVersion
          # (25.0.4.1+1 is newer than 25.0.4+9).
          binary_metadata="$(curl "${binary_metadata_url}" --silent \
            | jq 'sort_by([.interimVersion, .updateVersion, .patchVersion, .buildVersion]) | reverse')"
          echo "${binary_metadata}" | jq '.'
          download_url="$(echo "${binary_metadata}" | jq '.[0].downloadUrl' -r)"
          download_checksum="$(echo "${binary_metadata}" | jq '.[0].sha1' -r)"

          JDK_VERSION="$(echo "${binary_metadata}" | jq '.[0].version' -r)"
          BELLSOFT_JDK_TARBALL="bellsoft-${JDK_VERSION}.tar.gz"
          echo "# Bellsoft JDK v${JDK_VERSION}" >> $GITHUB_STEP_SUMMARY

          fail() {
            echo "## ERROR: $1" >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          # The release tag is the JDK version (e.g. 25.0.4.1+1)
          release_tag="${JDK_VERSION}"
          asset_name="$(echo "${binary_metadata}" | jq '.[0].filename' -r)"
          expected_url="https://github.com/bell-sw/Liberica/releases/download/${release_tag}/${asset_name}"
          [[ "${download_url}" == "${expected_url}" ]] \
            || fail "Download URL ${download_url} is not the expected ${expected_url}"

          curl --fail --location --output "${BELLSOFT_JDK_TARBALL}" "${download_url}"

          # 1. SHA1 published by the BellSoft API (api.bell-sw.com)
          echo "${download_checksum}  ${BELLSOFT_JDK_TARBALL}" | shasum --algorithm=1 --check - \
            || fail "Downloaded file did not match SHA1 from the BellSoft API"

          # 2. Independent SHA256 digest GitHub recorded for the release asset
          github_digest="$(gh api "repos/bell-sw/Liberica/releases/tags/${release_tag}" \
            --jq ".assets[] | select(.name == \"${asset_name}\") | .digest")"
          [[ "${github_digest}" == sha256:* ]] \
            || fail "GitHub has no sha256 digest for ${asset_name} in release ${release_tag}"
          echo "${github_digest#sha256:}  ${BELLSOFT_JDK_TARBALL}" | shasum --algorithm=256 --check - \
            || fail "Downloaded file did not match the SHA256 digest from the GitHub release"
          echo "Verified SHA1 (BellSoft API) and SHA256 (GitHub release digest)" >> $GITHUB_STEP_SUMMARY

          OLD_JDK_NAME=$(bosh blobs | grep bellsoft | cut -f1 | tr -d ' ')
          
          if [[ "${OLD_JDK_NAME}" == "${BELLSOFT_JDK_TARBALL}" ]]; then
            echo "## ☑️ No new version of bellsoft-${JDK_VERSION} found." >> $GITHUB_STEP_SUMMARY 
            exit 0
          fi
          
          echo "## ✅ Found new version ${BELLSOFT_JDK_TARBALL}" >> $GITHUB_STEP_SUMMARY
          echo "Previous Version: ${OLD_JDK_NAME}" >> $GITHUB_STEP_SUMMARY

          bosh add-blob --sha2 "${BELLSOFT_JDK_TARBALL}" "${BELLSOFT_JDK_TARBALL}"
          bosh upload-blobs
          bosh remove-blob "${OLD_JDK_NAME}"
          
          git status
          git add config/blobs.yml
          git status

          BRANCH_NAME="Java-${JDK_VERSION}"

          if [[ -n "$(gh pr list --head "${BRANCH_NAME}" --state open --json number --jq '.[0].number')" ]]; then
            echo "## ☑️ PR already open for ${BRANCH_NAME}" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          git checkout -b "${BRANCH_NAME}"
          git commit -m "Upgrade Bellsoft JDK to version ${JDK_VERSION}"
          git push -u origin "${BRANCH_NAME}"

          echo "✅ Committed $(git log -n 1 --graph --pretty='%Cred%h%Creset - %s%Creset' | sed 's/^.//')" >> $GITHUB_STEP_SUMMARY

          gh pr create --title "Upgrade Bellsoft JDK to version ${JDK_VERSION}" --body "Automated upgrade of Bellsoft JDK to version ${JDK_VERSION}."
